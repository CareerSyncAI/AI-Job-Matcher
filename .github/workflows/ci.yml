name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          CAREERSYNC_JWT_SECRET: "ci-test-jwt-secret-minimum-32-chars-long"
          CAREERSYNC_ENVIRONMENT: "development"
          CAREERSYNC_AUTO_SEED_DEMO_DATA: "false"
          CAREERSYNC_AI_SERVICE_URL: "http://localhost:8001"
          CAREERSYNC_AI_SERVICE_API_KEY: "ci-test-ai-key"
          PYTHONPATH: "."
        run: |
          python -m pytest -v

  ai-services-tests:
    name: AI Services Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ai-services/requirements.txt"

      - name: Install AI Services Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ai-services/requirements.txt

      - name: Run AI Services Pytest Suite
        working-directory: ai-services
        env:
          AI_SERVICE_API_KEY: "ci-test-ai-key"
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: npm run build

  postgres-integration:
    name: PostgreSQL + pgvector Integration & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.7.0-pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: careersync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify PostgreSQL Readiness and pgvector Extension
        working-directory: backend
        env:
          CAREERSYNC_DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5432/careersync_test"
        run: |
          python -c "
          import time, os
          from sqlalchemy import create_engine, text
          url = os.environ['CAREERSYNC_DATABASE_URL']
          for attempt in range(30):
              try:
                  eng = create_engine(url)
                  with eng.connect() as conn:
                      conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector;'))
                      ext = conn.execute(text(\"SELECT extname, extversion FROM pg_extension WHERE extname = 'vector'\")).fetchone()
                      print(f'PostgreSQL ready. Extension: {ext}')
                      break
              except Exception as e:
                  time.sleep(1)
          else:
              raise SystemExit('Timed out waiting for PostgreSQL to become ready')
          "

      - name: Run Alembic Migrations (Upgrade to Head)
        working-directory: backend
        env:
          CAREERSYNC_DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5432/careersync_test"
          CAREERSYNC_JWT_SECRET: "ci-test-jwt-secret-minimum-32-chars-long"
          CAREERSYNC_ENVIRONMENT: "development"
        run: |
          alembic upgrade head

      - name: Verify Alembic Downgrade and Re-upgrade Lifecycle
        working-directory: backend
        env:
          CAREERSYNC_DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5432/careersync_test"
          CAREERSYNC_JWT_SECRET: "ci-test-jwt-secret-minimum-32-chars-long"
          CAREERSYNC_ENVIRONMENT: "development"
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run PostgreSQL Integration Tests
        working-directory: backend
        env:
          CAREERSYNC_DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5432/careersync_test"
          REQUIRE_POSTGRES: "true"
          CAREERSYNC_JWT_SECRET: "ci-test-jwt-secret-minimum-32-chars-long"
          CAREERSYNC_ENVIRONMENT: "development"
          CAREERSYNC_AUTO_SEED_DEMO_DATA: "false"
          CAREERSYNC_AI_SERVICE_URL: "http://localhost:8001"
          CAREERSYNC_AI_SERVICE_API_KEY: "ci-test-ai-key"
          PYTHONPATH: "."
        run: |
          python -m pytest tests/test_postgres_migrations.py -v
