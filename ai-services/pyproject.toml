[tool.poetry]
name = "careersync-ai-engine"
version = "1.0.0"
description = "High-precision layout-aware resume parsing, skill extraction, and semantic matching for CareerSync AI."
authors = ["CareerSync AI Team"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
pydantic = ">=2.8,<3.0"
python-multipart = ">=0.0.12,<1.0"
pypdf = ">=4.3.0"
pdfplumber = ">=0.11.0"
python-docx = ">=1.1.2"
numpy = ">=1.26.0,<3.0"
scikit-learn = ">=1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
