[tool.poetry]
name = "careersync-ai-engine"
version = "1.0.0"
description = "High-precision layout-aware resume parsing, skill extraction, and semantic matching for CareerSync AI."
authors = ["CareerSync AI Team"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.133.0,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
pydantic = ">=2.8,<3.0"
python-multipart = ">=0.0.31,<1.0"
pypdf = ">=7.2.0"
pdfplumber = ">=0.11.9"
python-docx = ">=1.1.2"
numpy = ">=1.26.0,<3.0"
scikit-learn = ">=1.5.0"
torch = ">=2.15.0"
sentence-transformers = ">=6.0.0"
# Security floors for PDF parsing, request parsing, model caching, and TLS.
pillow = ">=13.0.0"
pypdfium2 = ">=5.15.2"
starlette = ">=1.3.1"
certifi = ">=2026.10.18"
filelock = ">=4.2.1"
setuptools = ">=84.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
