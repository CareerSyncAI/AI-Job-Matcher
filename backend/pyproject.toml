[tool.poetry]
name = "careersync-api"
version = "0.1.0"
description = "Secure API and deterministic evaluation domain for CareerSync AI."
authors = ["CareerSync AI Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<2.1"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
alembic = ">=1.13,<2.0"
pydantic-settings = ">=2.4,<3.0"
email-validator = ">=2.2,<3.0"
pyjwt = { version = ">=2.9,<3.0", extras = ["crypto"] }
argon2-cffi = ">=23.1,<24.0"
python-multipart = ">=0.0.12,<1.0"
celery = { version = ">=5.4,<6.0", extras = ["redis"] }
redis = ">=5.0,<6.0"
pgvector = ">=0.3,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-cov = ">=5.0,<7.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.6,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
