services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careersync
      POSTGRES_USER: careersync
      POSTGRES_PASSWORD: careersync
    ports:
      - "5432:5432"
    volumes:
      - careersync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careersync -d careersync"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - careersync-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  careersync-postgres:
  careersync-redis:
